<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snatrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        /* AJUSTE 1: Garantir que o body e html ocupem 100% da tela e travem o scroll nativo */
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'VT323', monospace;
            background-color: #000000;
            color: #00FF41;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        .screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            background-color: #000;
            overflow-y: auto;
        }

        .active-screen {
            display: flex;
        }

        h1.title {
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            color: #00FF41;
            text-shadow: 0 0 20px #00FF41;
            margin-bottom: 1.5rem;
            text-align: center;
            line-height: 1;
        }

        .menu-btn {
            background-color: transparent;
            color: #00FF41;
            border: 2px solid #00FF41;
            padding: 10px 20px;
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            margin: 6px;
            font-family: 'VT323', monospace;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .menu-btn:hover:not(:disabled) {
            background-color: #00FF41;
            color: #000;
            box-shadow: 0 0 15px #00FF41;
        }

        .menu-btn:disabled {
            border-color: #004d00;
            color: #004d00;
            cursor: not-allowed;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 90%;
            max-width: 450px;
            margin-bottom: 20px;
        }

        .level-card {
            aspect-ratio: 1;
            border: 2px solid #00FF41;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .level-card.locked {
            border-color: #004d00;
            color: #004d00;
            cursor: not-allowed;
        }

        .level-card:not(.locked):hover {
            background: #00FF41;
            color: #000;
            box-shadow: 0 0 10px #00FF41;
        }

        .custom-level-card {
            grid-column: span 5;
            border-color: #00FFFF;
            color: #00FFFF;
            aspect-ratio: auto;
            padding: 10px;
        }

        .options-panel {
            margin-top: 1rem;
            border: 1px solid #00FF41;
            padding: 0.8rem;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.1rem;
            cursor: pointer;
            font-family: inherit;
        }

        .toggle-btn.on {
            color: #00FF41;
            text-shadow: 0 0 5px #00FF41;
        }

        /* AJUSTE 2: Ajuste responsivo para iFrames (CrazyGames Preview) */
        canvas.game-cvs {
            border: 2px solid #004d00;
            background-color: #050505;
            width: 100%;
            max-width: 100vmin;
            max-height: 75vh;
            aspect-ratio: 1 / 1;
            object-fit: contain;
        }

        #threeCanvas {
            display: none;
        }

        .stats-container {
            position: absolute;
            top: 10px;
            right: 20px;
            text-align: right;
            z-index: 10;
            pointer-events: none;
        }

        .stat-text {
            font-size: clamp(0.9rem, 2.5vw, 1.5rem);
            line-height: 1.2;
            text-shadow: 0 0 5px #000;
        }

        .message-box {
            position: absolute;
            background-color: rgba(0, 15, 0, 0.98);
            color: #00FF41;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 40;
            border: 3px solid #00FF41;
            width: 85%;
            max-width: 350px;
        }

        .color-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-size: 1.2rem;
        }

        input[type="color"] {
            border: 2px solid #00FF41;
            background: #000;
            cursor: pointer;
            height: 30px;
            width: 50px;
            padding: 1px;
        }

        input[type="number"],
        input[type="text"] {
            background: transparent;
            border: 2px solid #00FF41;
            color: #00FF41;
            font-family: inherit;
            font-size: 1.2rem;
            width: 100%;
            padding: 4px;
            text-align: center;
            margin-bottom: 10px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tool-btn {
            padding: 5px 10px;
            border: 2px solid #444;
            background: #000;
            color: #fff;
            cursor: pointer;
            font-family: inherit;
        }

        .tool-btn.active {
            border-color: #00FF41;
            color: #00FF41;
            box-shadow: 0 0 10px #00FF41;
        }

        .map-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border: 1px solid #00FF41;
            padding: 8px;
            margin-bottom: 8px;
        }

        .map-actions button {
            background: none;
            border: 1px solid #00FF41;
            color: #00FF41;
            padding: 4px 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            margin-left: 4px;
        }

        .map-actions button:hover {
            background: #00FF41;
            color: #000;
        }
    </style>
</head>

<body>

    <div id="mainMenu" class="screen active-screen">
        <h1 class="title">SNATRIX</h1>
        <button class="menu-btn" onclick="initAndGo(() => showScreen('casualSubMenu'))">MODO CASUAL</button>
        <button class="menu-btn" onclick="initAndGo(() => startMode('endless'))"
            style="border-color: #00FFFF; color: #00FFFF; text-shadow: 0 0 10px #00FFFF;">MODO ZEN (3D)</button>
        <button class="menu-btn" onclick="initAndGo(() => openBattleMenu())"
            style="border-color: #FFA500; color: #FFA500;">MODO BATALHA</button>
        <button class="menu-btn" onclick="initAndGo(() => openMapManager())"
            style="border-color: #FF00FF; color: #FF00FF;">MEUS MAPAS</button>
        <div class="options-panel">
            <button id="btnSound" class="toggle-btn on" onclick="toggleSound()">Sons: ON</button>
            <button id="btnMusic" class="toggle-btn on" onclick="toggleMusic()">Música: ON</button>
        </div>
    </div>

    <div id="casualSubMenu" class="screen">
        <h1 class="title" style="font-size: 2.5rem;">ESCOLHA A MODALIDADE</h1>
        <button class="menu-btn" onclick="openLevelSelect('normal')">MODO NORMAL</button>
        <button class="menu-btn" onclick="openLevelSelect('hard')" style="border-color: #ff3333; color: #ff3333;">MODO
            DIFÍCIL</button>
        <button class="menu-btn" onclick="openLevelSelect('neo')"
            style="border-color: #00FFFF; color: #00FFFF; text-shadow: 0 0 10px #00FFFF;">MODO NEO</button>
        <button class="menu-btn mt-6" onclick="showScreen('mainMenu')"
            style="border-color: #aaa; color: #aaa;">VOLTAR</button>
    </div>

    <div id="mapManagerScreen" class="screen" style="justify-content: flex-start; padding-top: 5vh;">
        <h1 class="title" style="font-size: 2.5rem; color: #FF00FF; text-shadow: 0 0 10px #FF00FF;">MEUS MAPAS</h1>
        <div class="w-full max-w-md px-4 flex flex-col items-center">
            <p id="mapCountText" class="mb-4 text-xl">Mapas: 0/10</p>
            <div id="mapListContainer" class="w-full flex flex-col mb-4 max-h-[50vh] overflow-y-auto pr-2"></div>
            <button id="btnCreateMap" class="menu-btn !w-full" onclick="openEditor(null)"
                style="border-color: #00FFFF; color: #00FFFF;">+ CRIAR NOVO MAPA</button>
            <button class="menu-btn !w-full mt-2" onclick="showScreen('mainMenu')"
                style="border-color: #ff3333; color: #ff3333;">VOLTAR</button>
        </div>
    </div>

    <div id="editorScreen" class="screen">
        <h1 class="title" style="font-size: 2rem;">CRIADOR DE MAPAS</h1>
        <input type="text" id="editorMapName" placeholder="Nome do Mapa" maxlength="20" class="max-w-[300px]">
        <div class="toolbar">
            <button class="tool-btn active" id="toolObs" onclick="setTool('obs')">⬛ Obstáculo</button>
            <button class="tool-btn" id="toolTp" onclick="setTool('tp')"
                style="color: #00FFFF; border-color:#00FFFF;">🌀 Teleporte</button>
            <button class="tool-btn" id="toolErase" onclick="setTool('erase')"
                style="color: #ff3333; border-color:#ff3333;">🗑 Borracha</button>
        </div>
        <p id="editorHint" class="mb-2 text-sm text-center">Clique e arraste para desenhar paredes.</p>
        <canvas id="editorCanvas" width="500" height="500" class="game-cvs mb-4"></canvas>
        <div class="flex flex-wrap justify-center gap-2">
            <button class="menu-btn !w-auto !text-lg !px-4" onclick="saveEditorMap()">SALVAR MAPA</button>
            <button class="menu-btn !w-auto !text-lg !px-4" onclick="clearEditor()"
                style="border-color: #ff9900; color:#ff9900;">LIMPAR TUDO</button>
            <button class="menu-btn !w-auto !text-lg !px-4" onclick="showScreen('mapManagerScreen')"
                style="border-color: #ff3333; color: #ff3333;">CANCELAR</button>
        </div>
    </div>

    <div id="levelSelectScreen" class="screen" style="justify-content: flex-start; padding-top: 5vh;">
        <h1 id="levelSelectTitle" class="title" style="font-size: 2.5rem; margin-bottom: 0.5rem;">CASUAL</h1>
        <div class="flex gap-6 w-full max-w-2xl px-4 justify-center flex-wrap">
            <div class="w-full max-w-xs border-2 border-green-900 p-4" style="height: fit-content;">
                <h3 class="text-xl text-center mb-2">CUSTOMIZAR COBRA</h3>
                <div class="color-row"><label>Cabeça:</label> <input type="color" id="p1HeadC" onchange="saveColors()">
                </div>
                <div class="color-row mt-2"><label>Corpo:</label> <input type="color" id="p1BodyC"
                        onchange="saveColors()"></div>
            </div>
            <div class="w-full max-w-sm">
                <div id="levelGrid" class="level-grid" style="width: 100%;"></div>
            </div>
        </div>
        <button class="menu-btn mt-4" onclick="showScreen('casualSubMenu')"
            style="border-color: #ff3333; color: #ff3333;">VOLTAR</button>
    </div>

    <div id="battleMenu" class="screen" style="justify-content: flex-start; padding-top: 5vh;">
        <h1 class="title" style="font-size: 2.5rem;">ARENA DE BATALHA</h1>
        <div class="flex gap-6 w-full max-w-3xl px-4 justify-center flex-wrap">
            <div class="w-full max-w-xs border-2 border-green-900 p-4 flex flex-col gap-2">
                <h3 class="text-xl text-center">REGRAS</h3>
                <select id="bMap" class="menu-btn !m-0 !w-full" style="font-size: 1.2rem;"></select>
                <select id="bType" class="menu-btn !m-0 !w-full" style="font-size: 1.2rem;">
                    <option value="score">META DE PONTOS</option>
                    <option value="time">LIMITE DE TEMPO (s)</option>
                </select>
                <div class="color-row mt-2 justify-center">
                    <label class="mr-2">Valor:</label>
                    <input type="number" id="bTarget" value="20" min="5" max="999" class="!mb-0">
                </div>
                <select id="bPlayers" class="menu-btn !m-0 !w-full mt-2" style="font-size: 1.2rem;">
                    <option value="1v1">1 VS BOT</option>
                    <option value="1v2">1 VS 2 BOTS</option>
                    <option value="2p">2 PLAYERS LOCAL</option>
                </select>
            </div>
            <div class="w-full max-w-xs border-2 border-green-900 p-4">
                <h3 class="text-xl text-center mb-2" style="color: #FF00FF;">CUSTOMIZAR P2</h3>
                <div class="color-row"><label style="color: #FF00FF;">Cabeça P2:</label> <input type="color"
                        id="p2HeadC" onchange="saveColors()"></div>
                <div class="color-row mt-2"><label style="color: #FF00FF;">Corpo P2:</label> <input type="color"
                        id="p2BodyC" onchange="saveColors()"></div>
                <p class="text-xs text-center mt-4 text-gray-400">P1 usa a cor configurada no menu Casual.</p>
            </div>
        </div>
        <button class="menu-btn mt-6" onclick="applyBattleSettingsAndStart()">INICIAR BATALHA</button>
        <button class="menu-btn" onclick="showScreen('mainMenu')"
            style="border-color: #ff3333; color: #ff3333;">VOLTAR</button>
    </div>

    <div id="gameScreen" class="screen">
        <div id="gameModeTitle" class="absolute top-2 left-4 text-xl opacity-80"
            style="text-shadow: 0 0 5px #000; z-index: 10;">MODO</div>

        <div class="absolute top-2 left-1/2 transform -translate-x-1/2 flex gap-2" style="z-index: 20;">
            <button class="menu-btn"
                style="font-size: 1rem; padding: 4px 10px; margin: 0; min-width: 70px; border-color: #ff3333; color: #ff3333;"
                onclick="returnToModeMenu()">⬅ VOLTAR</button>
            <button id="pauseBtn" class="menu-btn"
                style="font-size: 1rem; padding: 4px 10px; margin: 0; min-width: 90px;" onclick="togglePauseUI()">⏸
                PAUSE</button>
            <button id="skipBtn" class="menu-btn" style="font-size: 1rem; padding: 4px 10px; margin: 0;"
                onclick="skipTrack()">⏭ MÚSICA</button>
        </div>

        <div id="dynamicStats" class="stats-container"></div>
        <canvas id="gameCanvas" width="600" height="600" class="game-cvs"></canvas>
        <canvas id="threeCanvas" width="600" height="600" class="game-cvs"></canvas>

        <div id="pauseMenu" class="message-box" style="background-color: rgba(0, 0, 0, 0.9);">
            <h2 style="font-size: 2.5rem; margin:0; text-shadow: 0 0 10px #00FF41;">PAUSADO</h2>
            <button class="menu-btn" onclick="togglePauseUI()">▶ CONTINUAR</button>
            <button id="devPrevBtn" class="menu-btn" style="border-color: #00FFFF; color: #00FFFF; display: none;"
                onclick="devChangeLevel(-1)">⏮ FASE ANT. (DEV)</button>
            <button id="devNextBtn" class="menu-btn" style="border-color: #00FFFF; color: #00FFFF; display: none;"
                onclick="devChangeLevel(1)">⏭ PRÓX. FASE (DEV)</button>
            <button class="menu-btn" onclick="returnToMainMenu()" style="border-color: #ff3333; color: #ff3333;">MENU
                PRINCIPAL</button>
        </div>
        <div id="nextLevelMenu" class="message-box">
            <h2 style="font-size: 2rem; margin:0;">FASE CONCLUÍDA!</h2>
            <div id="menuStats" class="stat-text"></div>
            <button id="btnNextLevel" class="menu-btn" onclick="startNextLevel()">PRÓXIMA FASE</button>
            <button class="menu-btn" onclick="returnToModeMenu()"
                style="border-color: #ff3333; color: #ff3333;">VOLTAR</button>
        </div>
        <div id="alertBox" class="message-box" style="border-color: #ff3333; color: #ff3333;">
            <h2 id="alertTitle" style="font-size: 2rem; margin:0;">AVISO</h2>
            <p id="alertMessage" class="stat-text"></p>
            <button id="returnMenuBtn" class="menu-btn" onclick="returnToModeMenu()"
                style="display:none; border-color: #ff3333; color: #ff3333;">VOLTAR</button>
        </div>
    </div>

    <script>
        // CHAVE DE DESENVOLVEDOR: Mude para 'false' antes de publicar na CrazyGames.
        const DEV_UNLOCK_ALL = false;

        let savedData = {
            maxLvlNorm: 1, maxLvlHard: 1, maxLvlNeo: 1, zenHighScore: 0,
            colors: { p1H: "#00FF41", p1B: "#00C832", p2H: "#FF00FF", p2B: "#C800C8" },
            customMaps: []
        };

        let cgSdk = null;
        let toneStarted = false;
        let soundEnabled = true;
        let musicEnabled = true;

        window.addEventListener("load", async () => {
            try {
                if (typeof window.CrazyGames !== 'undefined' && window.CrazyGames.SDK) {
                    await window.CrazyGames.SDK.init();
                    cgSdk = window.CrazyGames.SDK;
                    let cloudData = await cgSdk.data.getItem('snakeSaveNeo');
                    if (cloudData) loadSaveSafely(cloudData);
                } else {
                    let localData = localStorage.getItem('snakeSaveNeo');
                    if (localData) loadSaveSafely(localData);
                }
            } catch (e) { console.log("Save local ativado."); }

            document.getElementById('p1HeadC').value = savedData.colors.p1H;
            document.getElementById('p1BodyC').value = savedData.colors.p1B;
            document.getElementById('p2HeadC').value = savedData.colors.p2H;
            document.getElementById('p2BodyC').value = savedData.colors.p2B;
        });

        function loadSaveSafely(data) {
            try {
                let parsed = typeof data === 'string' ? JSON.parse(data) : data;
                if (parsed.maxLvlNorm) savedData.maxLvlNorm = parsed.maxLvlNorm;
                if (parsed.maxLvlHard) savedData.maxLvlHard = parsed.maxLvlHard;
                if (parsed.maxLvlNeo) savedData.maxLvlNeo = parsed.maxLvlNeo;
                if (parsed.zenHighScore) savedData.zenHighScore = parsed.zenHighScore;
                if (parsed.colors) savedData.colors = parsed.colors;
                if (parsed.customMaps) savedData.customMaps = parsed.customMaps;
            } catch (e) { }
        }

        async function saveProgress() {
            try {
                const dataStr = JSON.stringify(savedData);
                if (cgSdk) await cgSdk.data.setItem('snakeSaveNeo', dataStr);
                localStorage.setItem('snakeSaveNeo', dataStr);
            } catch (e) { }
        }

        function saveColors() {
            savedData.colors.p1H = document.getElementById('p1HeadC').value;
            savedData.colors.p1B = document.getElementById('p1BodyC').value;
            savedData.colors.p2H = document.getElementById('p2HeadC').value;
            savedData.colors.p2B = document.getElementById('p2BodyC').value;
            saveProgress(); sfx.click();
        }

        async function initAndGo(callback) {
            if (!toneStarted) { await Tone.start(); toneStarted = true; }
            sfx.click(); callback();
        }

        function notifyGameStart() { try { if (cgSdk) cgSdk.game.gameplayStart(); } catch (e) { } }
        function notifyGameStop() { try { if (cgSdk) cgSdk.game.gameplayStop(); } catch (e) { } }

        // ==========================================
        // ÁUDIO: SFX & PLAYLISTS TONE.JS
        // ==========================================
        const sfxSynth = new Tone.PolySynth(Tone.Synth).toDestination();
        const hitSynth = new Tone.MembraneSynth().toDestination();

        const sfx = {
            click: () => { if (soundEnabled) sfxSynth.triggerAttackRelease("C6", "16n", undefined, 0.1); },
            eat: () => { if (soundEnabled) sfxSynth.triggerAttackRelease(["E5", "G5"], "8n", undefined, 0.2); },
            eatBot: () => { if (soundEnabled) sfxSynth.triggerAttackRelease("E4", "8n", undefined, 0.1); },
            tp: () => { if (soundEnabled) { sfxSynth.triggerAttackRelease("C5", "16n"); setTimeout(() => sfxSynth.triggerAttackRelease("E5", "16n"), 100); } },
            warn: () => { if (soundEnabled) sfxSynth.triggerAttackRelease("G6", "32n", undefined, 0.05); }, // Neo warning
            hit: () => { if (soundEnabled) hitSynth.triggerAttackRelease("C2", "8n", undefined, 0.4); },
            hitSoft: () => { if (soundEnabled) hitSynth.triggerAttackRelease("G2", "16n", undefined, 0.2); },
            win: () => { if (soundEnabled) sfxSynth.triggerAttackRelease(["C5", "E5", "G5"], "4n", undefined, 0.3); },
            jump: () => { if (soundEnabled) sfxSynth.triggerAttackRelease("G4", "8n", undefined, 0.1); }
        };

        const casualMusicSynth = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "triangle" } }).toDestination();
        const zenMusicSynth = new Tone.FMSynth({ harmonicity: 2, modulationIndex: 5, oscillator: { type: "sine" } }).toDestination();
        const battleMusicSynth = new Tone.Synth({ oscillator: { type: "sawtooth" } }).toDestination();
        const zenReverb = new Tone.Reverb({ decay: 4, wet: 0.6 }).toDestination();
        zenMusicSynth.connect(zenReverb);

        const tracks = {
            casual: [
                new Tone.Sequence((time, note) => { casualMusicSynth.triggerAttackRelease(note, "8n", time, 0.1); }, ["C4", "E4", "G4", "C5"], "8n"),
                new Tone.Sequence((time, note) => { casualMusicSynth.triggerAttackRelease(note, "8n", time, 0.1); }, ["F4", "A4", "C5", "F5"], "8n"),
                new Tone.Sequence((time, note) => { casualMusicSynth.triggerAttackRelease(note, "8n", time, 0.1); }, ["G4", "B4", "D5", "G5"], "8n"),
                new Tone.Sequence((time, note) => { casualMusicSynth.triggerAttackRelease(note, "8n", time, 0.1); }, ["C4", "D4", "E4", "F4", "G4"], "8n"),
                new Tone.Sequence((time, note) => { casualMusicSynth.triggerAttackRelease(note, "8n", time, 0.1); }, ["E4", "G4", "B4", "D5"], "8n"),
                new Tone.Sequence((time, note) => { casualMusicSynth.triggerAttackRelease(note, "8n", time, 0.1); }, ["A4", "C5", "E5", "A5"], "8n"),
                new Tone.Sequence((time, note) => { casualMusicSynth.triggerAttackRelease(note, "8n", time, 0.1); }, ["D4", "F#4", "A4", "D5"], "8n"),
                new Tone.Sequence((time, note) => { casualMusicSynth.triggerAttackRelease(note, "8n", time, 0.1); }, ["G4", "C5", "E5", "G5"], "8n"),
                new Tone.Sequence((time, note) => { casualMusicSynth.triggerAttackRelease(note, "8n", time, 0.1); }, ["C4", "G4", "E4", "C5"], "8n"),
                new Tone.Sequence((time, note) => { casualMusicSynth.triggerAttackRelease(note, "8n", time, 0.1); }, ["F4", "C5", "A4", "F5"], "8n")
            ],
            zen: [
                new Tone.Sequence((time, note) => { zenMusicSynth.triggerAttackRelease(note, "2n", time, 0.05); }, ["C3", null, "G3", null, "D4", "C4"], "4n"),
                new Tone.Sequence((time, note) => { zenMusicSynth.triggerAttackRelease(note, "2n", time, 0.05); }, ["A2", "E3", "C4", "B3", null, "A3"], "4n"),

        function drawEditor() {
            eCtx.fillStyle = "#050505"; eCtx.fillRect(0, 0, eCvs.width, eCvs.height);
            eCtx.strokeStyle = "#111"; eCtx.lineWidth = 1;
            for (let i = 0; i <= eGrid; i++) { eCtx.beginPath(); eCtx.moveTo(i * eBox, 0); eCtx.lineTo(i * eBox, eCvs.height); eCtx.stroke(); eCtx.beginPath(); eCtx.moveTo(0, i * eBox); eCtx.lineTo(eCvs.width, i * eBox); eCtx.stroke(); }
            eCtx.fillStyle = "#004d00"; eObs.forEach(o => eCtx.fillRect(o.x * eBox, o.y * eBox, eBox - 1, eBox - 1));
            eTps.forEach(t => {
                eCtx.fillStyle = t.color; eCtx.fillRect(t.p1.x * eBox, t.p1.y * eBox, eBox - 1, eBox - 1); eCtx.fillRect(t.p2.x * eBox, t.p2.y * eBox, eBox - 1, eBox - 1);
                eCtx.fillStyle = "#000"; eCtx.fillRect(t.p1.x * eBox + 3, t.p1.y * eBox + 3, eBox - 7, eBox - 7); eCtx.fillRect(t.p2.x * eBox + 3, t.p2.y * eBox + 3, eBox - 7, eBox - 7);
            });
            if (eTempTp) { eCtx.fillStyle = "#FFFFFF"; eCtx.fillRect(eTempTp.x * eBox, eTempTp.y * eBox, eBox - 1, eBox - 1); }
        }

        function handleEditorAction(cx, cy) {
            let gx = Math.floor(cx / eBox), gy = Math.floor(cy / eBox);
            if (gx < 0 || gx >= eGrid || gy < 0 || gy >= eGrid) return;
            eObs = eObs.filter(o => o.x !== gx || o.y !== gy); eTps = eTps.filter(t => !(t.p1.x === gx && t.p1.y === gy) && !(t.p2.x === gx && t.p2.y === gy));
            if (eTool === 'obs') { eObs.push({ x: gx, y: gy }); }
            else if (eTool === 'tp') {
                if (!eTempTp) eTempTp = { x: gx, y: gy };
                else {
                    if (eTempTp.x !== gx || eTempTp.y !== gy) eTps.push({ p1: eTempTp, p2: { x: gx, y: gy }, color: teleportColors[eTps.length % teleportColors.length] });
                    eTempTp = null;

            drawEditor();
        }

        const hole = (x, y, w = 1, h = 1) => {
            obstacles = obstacles.filter(o => !(o.x >= x && o.x < x + w && o.y >= y && o.y < y + h));
        };

        function findSafeSpawn() {
            let safeSpots = [];
            for (let y = 3; y < gridCount - 3; y++) {
                for (let x = 3; x < gridCount - 3; x++) {
                    let isVerySafe = true;
                    // Procura 5x5 livre para garantir spawn justo
                    for (let dy = -2; dy <= 2; dy++) {
                        for (let dx = -3; dx <= 1; dx++) {
                            let cx = (x + dx + gridCount) % gridCount;
                            let cy = (y + dy + gridCount) % gridCount;
                            if (obstacles.some(o => o.x === cx && o.y === cy) || teleports.some(t => (t.p1.x === cx && t.p1.y === cy) || (t.p2.x === cx && t.p2.y === cy))) {
                                isVerySafe = false;
                            }
                        }
                    }
                    if (isVerySafe) safeSpots.push({ x: x, y: y });
                }
            }
            if (safeSpots.length > 0) return safeSpots[Math.floor(Math.random() * safeSpots.length)];

            // Fallback em caso de mapa muito apertado
            for (let y = 0; y < gridCount; y++) {
                for (let x = 0; x < gridCount; x++) {
                    let safe = true;
                    for (let i = 0; i < 3; i++) {
                        let checkX = (x - i + gridCount) % gridCount;
                        if (obstacles.some(o => o.x === checkX && o.y === y)) { safe = false; break; }
                        if (teleports.some(t => (t.p1.x === checkX && t.p1.y === y) || (t.p2.x === checkX && t.p2.y === y))) { safe = false; break; }
                    }
                    if (safe) return { x: x, y: y };
                }
            }
            return { x: 12, y: 12 };
        }

        function placeFood() {
            let availableSpots = [];
            for (let y = 0; y < gridCount; y++) {
                for (let x = 0; x < gridCount; x++) {
                    let occupied = obstacles.some(o => o.x === x && o.y === y) ||
                        teleports.some(t => (t.p1.x === x && t.p1.y === y) || (t.p2.x === x && t.p2.y === y)) ||
                        snakeP1.body.some(b => b.x === x && b.y === y) ||
                        (snakeP2.active && snakeP2.body.some(b => b.x === x && b.y === y)) ||
                        bots.some(b => b.body.some(s => s.x === x && s.y === y));

                    if (!occupied) availableSpots.push({ x, y });
                }
            }
            if (availableSpots.length > 0) {
                food = availableSpots[Math.floor(Math.random() * availableSpots.length)];
            } else {
                food = { x: -1, y: -1 };
            }
        }

                    case 11: line(4, 4, 20, 4); line(4, 20, 20, 20); break;
                    case 12: line(4, 4, 4, 20); line(20, 4, 20, 20); break;
                    case 13: boxWall(4, 4, 17, 17); hole(10, 4, 5, 1); hole(10, 20, 5, 1); break;
                    case 14: boxWall(0, 0, 25, 25); boxWall(6, 6, 13, 13); hole(10, 6, 5, 1); hole(10, 18, 5, 1); break;
                    case 15: for (let i = 4; i < 21; i += 4) obstacles.push({ x: i, y: 12 }); break;
                    case 16: for (let i = 4; i < 21; i += 4) obstacles.push({ x: 12, y: i }); break;
                    case 17: line(8, 8, 16, 8); line(8, 16, 16, 16); line(8, 8, 8, 16); line(16, 8, 16, 16); hole(10, 8, 5, 1); hole(10, 16, 5, 1); break;
                    case 18: boxWall(0, 0, 25, 25); for (let i = 4; i < 21; i += 4) obstacles.push({ x: i, y: i }); break;
                    case 19: boxWall(2, 2, 21, 21); boxWall(10, 10, 5, 5); hole(10, 2, 5, 1); hole(10, 22, 5, 1); hole(10, 10, 5, 1); hole(10, 14, 5, 1); break;
                    case 20: boxWall(0, 0, 25, 25); line(12, 4, 12, 20); line(4, 12, 20, 12); hole(10, 10, 5, 5); break;
                }
            }

            obstacles = obstacles.filter((v, i, a) => a.findIndex(v2 => (v2.x === v.x && v2.y === v.y)) === i);
        }

        function startMode(mode, levelOrMap = 1) {
            currentMode = mode; currentLevel = levelOrMap; trackIdx = 0; playMusic();

            if (mode === 'casual' && typeof levelOrMap === 'number') { targetScore = 5 + (levelOrMap * 2); }
            else if (mode === 'batalha') { targetScore = bTargetVal; }
            else { targetScore = 999; }

            snakeP1 = { body: [], dir: 'right', nextDir: 'right', score: 0, headC: savedData.colors.p1H, bodyC: savedData.colors.p1B };
            snakeP2 = { body: [], dir: 'left', nextDir: 'left', score: 0, active: false, headC: savedData.colors.p2H, bodyC: savedData.colors.p2B };
            bots = [];

            document.getElementById('returnMenuBtn').style.display = 'none';
            document.getElementById('pauseBtn').innerText = '⏸ PAUSE';

            if (mode === 'batalha') {
                const battleConfig = document.getElementById('bPlayers').value;
                if (battleConfig === '2p') snakeP2.active = true;
                if (battleConfig === '1v1') bots.push({ body: [], dir: 'left', score: 0, headC: '#FFFFFF', bodyC: '#aaaaaa', id: 1 });
                if (battleConfig === '1v2') { bots.push({ body: [], dir: 'left', score: 0, headC: '#FFFFFF', bodyC: '#aaaaaa', id: 1 }); bots.push({ body: [], dir: 'left', score: 0, headC: '#FF0000', bodyC: '#aa0000', id: 2 }); }
            }

            showScreen('gameScreen');
            initGame(true);
        }

        function initGame(newLevel = true) {
            clearInterval(gameLoop); clearInterval(bTimerInterval);
            if (tAnimationFrameId) cancelAnimationFrame(tAnimationFrameId);

            isRunning = false; isPaused = false; isWaitingForInput = true;
            document.getElementById('pauseMenu').style.display = 'none';
            document.getElementById('nextLevelMenu').style.display = 'none';
            document.getElementById('alertBox').style.display = 'none';

            if (currentMode === 'endless') {
                document.getElementById('gameCanvas').style.display = 'none';
                document.getElementById('threeCanvas').style.display = 'block';
                document.getElementById('gameModeTitle').innerText = "MODO ZEN (3D)";
                initThreeJS(); resetThreeJSGame(); animateThreeJS();
            } else {
                document.getElementById('gameCanvas').style.display = 'block';
                document.getElementById('threeCanvas').style.display = 'none';

                obstacles = []; teleports = []; snakeP1.score = 0; bgOffsetX = 0; bgOffsetY = 0;
                neoTick = 0; food = { x: -1, y: -1 };

                if (currentMode === 'casual') {
                    let isCustom = typeof currentLevel === 'string' && currentLevel.startsWith('map_');
                    let titleSub = currentCasualSubMode === 'neo' ? 'NEO' : (currentCasualSubMode === 'hard' ? 'DIFÍCIL' : 'NORMAL');
                    document.getElementById('gameModeTitle').innerText = isCustom ? `MEU MAPA` : `${titleSub} - FASE ${currentLevel}`;
                    lives = 3;
                    speed = isCustom ? 100 : Math.max(50, 140 - (currentLevel * 4));
                    loadLevelMap2D(currentLevel);
                } else {
                    currentCasualSubMode = 'normal';
                    document.getElementById('gameModeTitle').innerText = "ARENA BATALHA";
                    speed = 110; loadLevelMap2D(currentLevel);
                }

                let spawnHead = findSafeSpawn();
                snakeP1.body = []; snakeP1.dir = 'right'; snakeP1.nextDir = 'right';
                for (let i = 0; i < 3; i++) snakeP1.body.push({ x: (spawnHead.x - i + gridCount) % gridCount, y: spawnHead.y });

                if (snakeP2.active) {
                    let s2Spawn = findSafeSpawn();
                    snakeP2.body = []; snakeP2.dir = 'left'; snakeP2.nextDir = 'left';
                    for (let i = 0; i < 3; i++) snakeP2.body.push({ x: (s2Spawn.x + i) % gridCount, y: s2Spawn.y });
                }
                bots.forEach((b) => {
                    let bSpawn = findSafeSpawn();
                    b.body = []; b.dir = 'left';
                    for (let i = 0; i < 3; i++) b.body.push({ x: (bSpawn.x + i) % gridCount, y: bSpawn.y });
                });

                if (currentMode === 'batalha' && bModeType === 'time') { bTimeLeft = bTargetVal; bTimerInterval = setInterval(() => { if (!isRunning || isPaused) return; bTimeLeft--; updateDisplays(); if (bTimeLeft <= 0) endBattle(); }, 1000); }

                placeFood();
                if (currentMode === 'casual' && currentCasualSubMode === 'neo') spawnNeoTeleports();
                updateDisplays(); draw2D(true);
            }
        }

        function checkCollisionAndShrink(newHead, ownBodyObject) {
            let collided = false; let ownBody = ownBodyObject.body;
            if (ownBody.slice(1).some(s => s.x === newHead.x && s.y === newHead.y)) collided = true;
            if (ownBodyObject !== snakeP1 && snakeP1.body.some(s => s.x === newHead.x && s.y === newHead.y)) collided = true;
            if (snakeP2.active && ownBodyObject !== snakeP2 && snakeP2.body.some(s => s.x === newHead.x && s.y === newHead.y)) collided = true;
            bots.forEach(b => { if (ownBodyObject !== b && b.body.some(s => s.x === newHead.x && s.y === newHead.y)) collided = true; });

            if (collided) {
                if (ownBody.length > 3) ownBody.pop();
                if (ownBodyObject.score > 0) ownBodyObject.score--;
                sfx.hit(); updateDisplays();
            }
        }

        function draw2D(paused = false) {
            if (isPaused) return;
            ctx.fillStyle = "#050505"; ctx.fillRect(0, 0, canvas.width, canvas.height);

            // LOGICA NEO: Fuga e Teleportes Dinâmicos
            if (currentMode === 'casual' && currentCasualSubMode === 'neo' && !paused && isRunning) {
                neoTick++;
                neoFoodTimer--;
                if (neoFoodTimer <= 0) {
                    placeFood();
                    neoFoodTimer = Math.floor(Math.random() * 50) + 100;
                }

                neoTpTimer--;
                if (neoTpTimer <= 0) {
                    teleports = [];
                    spawnNeoTeleports();
                    neoTpTimer = Math.floor(Math.random() * 50) + 200;
                }
            }

            teleports.forEach(t => {
                ctx.fillStyle = t.color; ctx.fillRect(t.p1.x * box, t.p1.y * box, box - 1, box - 1); ctx.fillStyle = "#000"; ctx.fillRect(t.p1.x * box + 3, t.p1.y * box + 3, box - 7, box - 7);
                ctx.fillStyle = t.color; ctx.fillRect(t.p2.x * box, t.p2.y * box, box - 1, box - 1); ctx.fillStyle = "#000"; ctx.fillRect(t.p2.x * box + 3, t.p2.y * box + 3, box - 7, box - 7);
            });

            ctx.fillStyle = "#004d00"; obstacles.forEach(o => ctx.fillRect(o.x * box, o.y * box, box - 1, box - 1));

            if (food.x >= 0) {
                ctx.fillStyle = "#FFFFFF"; ctx.fillRect(food.x * box, food.y * box, box - 1, box - 1);
            }

            const drawSnake = (sObj) => { for (let i = sObj.body.length - 1; i >= 0; i--) { ctx.fillStyle = (i === 0) ? sObj.headC : sObj.bodyC; ctx.fillRect(sObj.body[i].x * box, sObj.body[i].y * box, box - 1, box - 1); } };
            bots.forEach(b => drawSnake(b)); if (snakeP2.active) drawSnake(snakeP2); drawSnake(snakeP1);

            if (paused) return;

            bots.forEach(b => {
                let hx = b.body[0].x, hy = b.body[0].y;
                if (hx < food.x && b.dir !== 'left') b.dir = 'right'; else if (hx > food.x && b.dir !== 'right') b.dir = 'left';
                else if (hy < food.y && b.dir !== 'up') b.dir = 'down'; else if (hy > food.y && b.dir !== 'down') b.dir = 'up';

                if (b.dir === 'left') hx--; else if (b.dir === 'up') hy--; else if (b.dir === 'right') hx++; else if (b.dir === 'down') hy++;
                if (hx < 0) hx = 24; if (hx > 24) hx = 0; if (hy < 0) hy = 24; if (hy > 24) hy = 0;

                let head = { x: hx, y: hy }; b.body.unshift(head); checkCollisionAndShrink(head, b);
                if (hx === food.x && hy === food.y) { sfx.eatBot(); b.score++; updateDisplays(); placeFood(); checkBattleWin(); } else b.body.pop();
            });

            const movePlayer = (pObj, isP1) => {
                pObj.dir = pObj.nextDir; let hx = pObj.body[0].x, hy = pObj.body[0].y;
                if (pObj.dir === 'left') hx--; else if (pObj.dir === 'up') hy--; else if (pObj.dir === 'right') hx++; else if (pObj.dir === 'down') hy++;
                if (hx < 0) hx = 24; if (hx > 24) hx = 0; if (hy < 0) hy = 24; if (hy > 24) hy = 0;

                for (let t of teleports) {
                    if (hx === t.p1.x && hy === t.p1.y) { hx = t.p2.x; hy = t.p2.y; if (isP1) sfx.tp(); break; }
                    else if (hx === t.p2.x && hy === t.p2.y) { hx = t.p1.x; hy = t.p1.y; if (isP1) sfx.tp(); break; }
                }

                const hitSelf = pObj.body.some(b => b.x === hx && b.y === hy);
                const hitObs = obstacles.some(o => o.x === hx && o.y === hy);

                if (currentMode === 'casual' && (hitSelf || hitObs)) { if (isP1) { sfx.hit(); handleDeath(); } return; }

                let head = { x: hx, y: hy }; pObj.body.unshift(head);
                if (currentMode === 'batalha') checkCollisionAndShrink(head, pObj);

                if (hx === food.x && hy === food.y) {
                    sfx.eat(); pObj.score++;
                    if (currentCasualSubMode === 'neo') { neoFoodTimer = Math.floor(Math.random() * 50) + 100; }
                    if (currentMode === 'casual' && pObj.score >= targetScore) { levelWin(); return; }
                    else if (currentMode === 'batalha') checkBattleWin();
                    placeFood();
                } else { pObj.body.pop(); }
            };

            if (snakeP2.active) movePlayer(snakeP2, false);
            if (isRunning) movePlayer(snakeP1, true);

            updateDisplays();
        }

        function updateDisplays() {
            const ui = document.getElementById('dynamicStats');
            if (currentMode === 'casual') {
                ui.innerHTML = `<div class="stat-text">PONTOS: ${snakeP1.score} / ${targetScore === 999 ? '∞' : targetScore}</div><div class="stat-text" style="color:#ff3333">VIDAS: ${lives}</div>`;
            } else if (currentMode === 'batalha') {
                let html = '';
                if (bModeType === 'time') html += `<div class="stat-text color-timer">Tempo: ${bTimeLeft}s</div>`; else html += `<div class="stat-text color-timer">Meta: ${bTargetVal} pts</div>`;
                html += `<div class="stat-text" style="color:${snakeP1.headC}">P1: ${snakeP1.score}</div>`;
                if (snakeP2.active) html += `<div class="stat-text" style="color:${snakeP2.headC}">P2: ${snakeP2.score}</div>`;
                if (bots.length > 0) html += `<div class="stat-text" style="color:#FFF;">Bot 1: ${bots[0].score}</div>`;
                if (bots.length > 1) html += `<div class="stat-text" style="color:#F00;">Bot 2: ${bots[1].score}</div>`;
                ui.innerHTML = html;
            }
        }

        function checkBattleWin() { if (currentMode !== 'batalha' || bModeType !== 'score') return; if (snakeP1.score >= bTargetVal || snakeP2.score >= bTargetVal || bots.some(b => b.score >= bTargetVal)) endBattle(); }

        function endBattle() {
            if (isRunning) notifyGameStop();
            isRunning = false; isPaused = false; clearInterval(gameLoop); clearInterval(bTimerInterval); sfx.win();
            let participants = [{ name: 'P1', score: snakeP1.score }];
            if (snakeP2.active) participants.push({ name: 'P2', score: snakeP2.score });
            bots.forEach((b, i) => participants.push({ name: `Bot ${i + 1}`, score: b.score }));
            participants.sort((a, b) => b.score - a.score);
            let winner = participants[0]; let isTie = participants[1] && participants[0].score === participants[1].score;
            let msg = isTie ? `EMPATE! (${winner.score} pontos)` : `${winner.name} VENCEU COM ${winner.score} PONTOS!`;

            document.getElementById('alertTitle').textContent = 'FIM DE BATALHA'; document.getElementById('alertMessage').textContent = msg;
            document.getElementById('returnMenuBtn').style.display = 'inline-block'; document.getElementById('alertBox').style.display = 'flex';
        }

        function levelWin() {
            isRunning = false; isPaused = false; clearInterval(gameLoop); sfx.win();
            let isCustom = typeof currentLevel === 'string' && currentLevel.startsWith('map_');
            if (currentLevel >= 20 || isCustom) {
            } else {
                if (currentCasualSubMode === 'normal' && currentLevel >= savedData.maxLvlNorm) { savedData.maxLvlNorm = currentLevel + 1; }
                else if (currentCasualSubMode === 'hard' && currentLevel >= savedData.maxLvlHard) { savedData.maxLvlHard = currentLevel + 1; }
                else if (currentCasualSubMode === 'neo' && currentLevel >= savedData.maxLvlNeo) { savedData.maxLvlNeo = currentLevel + 1; }
                saveProgress();
            }

            if (currentLevel === 20) document.getElementById('menuStats').innerHTML = `PARABÉNS! VOCÊ ZEROU O MODO ${currentCasualSubMode.toUpperCase()}!`;
            else document.getElementById('menuStats').innerHTML = isCustom ? `PONTUAÇÃO: ${snakeP1.score}` : `Fase ${currentLevel} concluída!<br>Vidas: ${lives}`;

            const nextBtn = document.getElementById('btnNextLevel');
            if (nextBtn) nextBtn.style.display = (currentLevel === 20 || isCustom) ? 'none' : 'block';

            document.getElementById('nextLevelMenu').style.display = 'flex';
        }

        function startNextLevel() {
            if (currentLevel >= 20 || (typeof currentLevel === 'string' && currentLevel.startsWith('map_'))) { returnToModeMenu(); return; }
            sfx.click(); document.getElementById('nextLevelMenu').style.display = 'none';
            currentLevel++; trackIdx++; playMusic(); initGame(true);
        }

        function handleDeath() {
            isRunning = false; isPaused = false; clearInterval(gameLoop); lives--;
            if (lives <= 0) {
                document.getElementById('alertTitle').innerText = "GAME OVER"; document.getElementById('alertMessage').innerText = "Suas vidas acabaram!";
                document.getElementById('returnMenuBtn').style.display = "block"; document.getElementById('alertBox').style.display = "flex";
            } else { setTimeout(() => initGame(false), 1000); }
        }

        let tsX, tsY;
        document.addEventListener('touchstart', e => { if (e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; }, { passive: false });
        document.addEventListener('touchmove', e => { if (isRunning && !isPaused && e.target.tagName !== 'CANVAS') e.preventDefault(); }, { passive: false });
        document.addEventListener('touchend', e => {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
            let dx = e.changedTouches[0].clientX - tsX, dy = e.changedTouches[0].clientY - tsY;
            if (isWaitingForInput && currentMode) { isWaitingForInput = false; isRunning = true; notifyGameStart(); if (currentActiveSequence && musicEnabled) Tone.Transport.start(); if (currentMode !== 'endless') gameLoop = setInterval(() => draw2D(false), speed); }
            if (!isRunning || isPaused) return;
            if (Math.abs(dx) < 30 && Math.abs(dy) < 30) { if (currentMode === 'endless' && !zenIsJumping && tPlayer && tPlayer.position.y <= 0.6) { zenIsJumping = true; zenJumpV = 0.25; sfx.jump(); } return; }
            if (Math.abs(dx) > Math.abs(dy)) {
                if (currentMode === 'endless') { if (dx > 0 && zenLane < 1) zenLane++; else if (dx < 0 && zenLane > -1) zenLane--; } else { if (dx > 0 && snakeP1.dir !== 'left') snakeP1.nextDir = 'right'; else if (dx < 0 && snakeP1.dir !== 'right') snakeP1.nextDir = 'left'; }
            } else { if (currentMode === 'endless') { if (dy < 0 && !zenIsJumping && tPlayer && tPlayer.position.y <= 0.6) { zenIsJumping = true; zenJumpV = 0.25; sfx.jump(); } } else { if (dy > 0 && snakeP1.dir !== 'up') snakeP1.nextDir = 'down'; else if (dy < 0 && snakeP1.dir !== 'down') snakeP1.nextDir = 'up'; } }
        });

        // OUVINTE UNIVERSAL DE TECLADO (PAUSE FUNCIONANDO 100%)
        document.addEventListener('keydown', e => {
            // Se estiver em um input, só ignora as teclas de movimento
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            // Bloqueia scroll do navegador ao usar setas
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }

            // O PAUSE AGORA TEM TOTAL PRIORIDADE
            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
                togglePauseUI();
                return;
            }

            if (DEV_UNLOCK_ALL && currentMode === 'casual' && typeof currentLevel === 'number') {
                if (e.key === 'n' || e.key === 'N') { devChangeLevel(1); return; }
                if (e.key === 'b' || e.key === 'B') { devChangeLevel(-1); return; }
            }

            const validKeys = ['ArrowLeft', 'ArrowUp', 'ArrowRight', 'ArrowDown', 'w', 'a', 's', 'd', 'W', 'A', 'S', 'D', ' '];
            if (isWaitingForInput && validKeys.includes(e.key) && currentMode) { isWaitingForInput = false; isRunning = true; notifyGameStart(); if (currentActiveSequence && musicEnabled) Tone.Transport.start(); if (currentMode !== 'endless') gameLoop = setInterval(() => draw2D(false), speed); }

            if (!isRunning || isPaused) return;

            if (currentMode === 'endless') {
                if (e.key === 'ArrowLeft' && zenLane > -1) zenLane--;
                if (e.key === 'ArrowRight' && zenLane < 1) zenLane++;
                if ((e.key === 'ArrowUp' || e.key === ' ') && !zenIsJumping && tPlayer && tPlayer.position.y <= 0.6) { zenIsJumping = true; zenJumpV = 0.25; sfx.jump(); }
                return;
            }
            if (e.key === 'ArrowLeft' && snakeP1.dir !== 'right') snakeP1.nextDir = 'left';
            if (e.key === 'ArrowUp' && snakeP1.dir !== 'down') snakeP1.nextDir = 'up';
            if (e.key === 'ArrowRight' && snakeP1.dir !== 'left') snakeP1.nextDir = 'right';
            if (e.key === 'ArrowDown' && snakeP1.dir !== 'up') snakeP1.nextDir = 'down';

            if (snakeP2.active) {
                if (e.key === 'a' || e.key === 'A') { if (snakeP2.dir !== 'right') snakeP2.nextDir = 'left'; }
                if (e.key === 'w' || e.key === 'W') { if (snakeP2.dir !== 'down') snakeP2.nextDir = 'up'; }
                if (e.key === 'd' || e.key === 'D') { if (snakeP2.dir !== 'left') snakeP2.nextDir = 'right'; }
                if (e.key === 's' || e.key === 'S') { if (snakeP2.dir !== 'up') snakeP2.nextDir = 'down'; }
            }
        });

        function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen')); document.getElementById(id).classList.add('active-screen'); }
    </script>
